<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .node-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .node-pulse-delayed {
      animation: pulse 3s ease-in-out infinite alternate;
      animation-delay: 1.5s;
    }
    .dash-flow {
      stroke-dasharray: 8 12;
      animation: dash 20s linear infinite;
    }
    .dash-flow-rev {
      stroke-dasharray: 6 10;
      animation: dashRev 15s linear infinite;
    }
    .float-card {
      animation: float 5s ease-in-out infinite alternate;
    }
    .float-card-rev {
      animation: floatRev 6s ease-in-out infinite alternate;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes dashRev {
      to {
        stroke-dashoffset: 1000;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Waves and Flows -->
  <g opacity="0.6">
    <path class="dash-flow" d="M -50 300 Q 250 180, 600 280 T 1250 200" fill="none" stroke="url(#flowGrad1)" stroke-width="3" filter="url(#glow)" />
    <path class="dash-flow-rev" d="M -50 100 Q 350 240, 700 80 T 1250 160" fill="none" stroke="url(#flowGrad2)" stroke-width="2.5" />
    <path class="dash-flow" d="M 0 340 C 400 300, 800 360, 1200 320" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <!-- Background Animated Pulse Orbs (Kept subtle & away from central text) -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.08" class="node-pulse" filter="url(#glow)" />
  <circle cx="1050" cy="270" r="140" fill="#8b5cf6" opacity="0.08" class="node-pulse-delayed" filter="url(#glow)" />

  <!-- Animated Feature Badges (Bottom Left & Right) -->
  <g class="float-card" transform="translate(60, 275)">
    <rect width="210" height="42" rx="21" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="22" cy="21" r="7" fill="#10b981" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Instant Recovery (RTO &lt; 5m)</text>
  </g>

  <g class="float-card-rev" transform="translate(930, 275)">
    <rect width="210" height="42" rx="21" fill="rgba(30, 41, 59, 0.7)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="22" cy="21" r="7" fill="#6366f1" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ Immutable Zero-Trust BaaS</text>
  </g>

  <g class="float-card" transform="translate(485, 290)">
    <rect width="230" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="#64748b" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="35" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🔄 VMware vSphere 7 / 8 / 9 CBT</text>
  </g>

  <!-- Central Foreground Content: Title & Subtitle Guaranteed Clear -->
  <!-- Tag Pill -->
  <g transform="translate(460, 40)">
    <rect width="280" height="34" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2" />
    <text x="140" y="22" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE CURATED MATRIX</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    VMware vSphere Cloud Backup &amp; Instant Recovery
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="170" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
    The Definitive Guide to BaaS, DRaaS, Enterprise &amp; Open-Source VM Data Protection
  </text>

  <!-- Subtitle Line 2 / Meta Chips -->
  <text x="600" y="206" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Ransomware Resilience • Near-Zero RPO/RTO • Change Block Tracking • Multi-Cloud Storage
  </text>

  <!-- Tech Highlights Row -->
  <g transform="translate(360, 230)">
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="55" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Veeam</text>

    <rect x="125" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="180" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Rubrik</text>

    <rect x="250" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="305" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Cohesity</text>

    <rect x="375" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="430" y="17" fill="#cbd5e1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Bareos &amp; Restic</text>
  </g>

  <!-- Subtle Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
</svg>
